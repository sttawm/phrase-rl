[project]
name = "phrase-rl"
version = "0.1.0"
description = "Advantage-weighted rephrase tuning against a frozen VLA (see EXPERIMENT.md)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "matplotlib",
    "scipy",
    "tqdm",
    "huggingface-hub",
    "pyarrow",
    "av",
    "google-genai",
]

[project.optional-dependencies]
# Installed on the pod only (heavy / CUDA). lerobot is pinned in
# scripts/setup_pod.sh after verifying compatibility with the INTACT
# pi0 checkpoints.
gpu = [
    "torch>=2.4",
    "transformers>=4.49",
    "accelerate",
    "peft",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phrase_rl"]
