<svg viewBox="0 44 1240 648" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrghost" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#cbd5e1"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1240" height="700" fill="white"/>

  <!-- stage bands -->
  <rect x="24" y="88" width="640" height="290" rx="18" fill="#f5f3ff" opacity="0.55"/>
  <text x="44" y="116" font-size="11" letter-spacing="3.5" fill="#8b5cf6" font-weight="bold">GENERATE</text>
  <rect x="684" y="60" width="532" height="430" rx="18" fill="#f0f9ff" opacity="0.6"/>
  <text x="704" y="88" font-size="11" letter-spacing="3.5" fill="#0ea5e9" font-weight="bold">EVALUATE</text>
  <rect x="24" y="508" width="1192" height="168" rx="18" fill="#fffbeb" opacity="0.55"/>
  <text x="44" y="662" font-size="11" letter-spacing="3.5" fill="#d97706" font-weight="bold">DISTILL &amp; ITERATE</text>


  <!-- original instructions -->
  <rect x="60" y="150" width="196" height="54" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3" filter="url(#soft)"/>
  <text x="158" y="172" font-size="13.5" text-anchor="middle" fill="#334155">original / training</text>
  <text x="158" y="190" font-size="13.5" text-anchor="middle" fill="#334155">instruction</text>
  <line x1="158" y1="204" x2="158" y2="242" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- rephraser -->
  <rect x="70" y="246" width="176" height="58" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#soft)"/>
  <text x="158" y="270" font-size="15.5" font-weight="bold" text-anchor="middle" fill="#312e81">rephraser</text>
  <text x="158" y="289" font-size="11.5" text-anchor="middle" fill="#6d28d9">VLM</text>

  <!-- fan-out -->
  <path d="M 246 262 C 300 240, 330 226, 366 221" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 246 290 C 300 312, 330 326, 366 331" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="370" y="206" width="122" height="30" rx="15" fill="white" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="431" y="226" font-size="12.5" text-anchor="middle" fill="#3730a3">rephrase 1</text>
  <text x="431" y="285" font-size="17" text-anchor="middle" fill="#a5b4fc" font-weight="bold">⋮</text>
  <rect x="370" y="316" width="122" height="30" rx="15" fill="white" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="431" y="336" font-size="12.5" text-anchor="middle" fill="#3730a3">rephrase N</text>
  <path d="M 492 221 C 536 227, 556 246, 576 261" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 492 331 C 536 325, 556 306, 576 291" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- VLA -->
  <rect x="580" y="246" width="120" height="58" rx="12" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5" filter="url(#soft)"/>
  <text x="640" y="270" font-size="15.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">VLA</text>
  <text x="640" y="289" font-size="11.5" text-anchor="middle" fill="#2b6cb0">executor</text>

  <!-- rank / evaluate -->
  <text x="826" y="280" font-size="12.5" font-weight="bold" letter-spacing="1.5" text-anchor="middle" fill="#475569">RANK / EVALUATE</text>
  <line x1="756" y1="290" x2="896" y2="290" stroke="#cbd5e1" stroke-width="1"/>

  <!-- sim branch -->
  <path d="M 700 256 C 726 220, 736 196, 752 178" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="756" y="128" width="216" height="56" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4" filter="url(#soft)"/>
  <text x="864" y="151" font-size="13" text-anchor="middle" fill="#134e4a">score with simulation</text>
  <text x="864" y="169" font-size="13" text-anchor="middle" fill="#134e4a">success-rate</text>
  <rect x="800" y="102" width="128" height="21" rx="10.5" fill="white" stroke="#0d9488" stroke-width="1"/>
  <text x="864" y="117" font-size="10.5" text-anchor="middle" fill="#0f766e">simulatable tasks</text>

  <!-- proxy branch -->
  <path d="M 700 294 C 726 330, 736 354, 752 372" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="756" y="366" width="216" height="56" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" filter="url(#soft)"/>
  <text x="864" y="389" font-size="13" text-anchor="middle" fill="#7c2d12">score with</text>
  <text x="864" y="407" font-size="13" text-anchor="middle" fill="#7c2d12">success-rate proxy</text>
  <rect x="762" y="430" width="204" height="21" rx="10.5" fill="white" stroke="#ea580c" stroke-width="1"/>
  <text x="864" y="445" font-size="10.5" text-anchor="middle" fill="#9a3412">non-simulatable / real-world tasks</text>

  <!-- scored phrases -->
  <path d="M 972 156 C 1040 168, 1072 204, 1090 240" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 972 394 C 1040 382, 1072 346, 1090 310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="1044" y="246" width="146" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#soft)"/>
  <text x="1117" y="270" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">scored</text>
  <text x="1117" y="290" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">phrases</text>

  <!-- scored -> LLM sweep -->
  <path d="M 1117 304 C 1117 440, 1030 560, 902 583" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <g opacity="0.30"><rect x="1006" y="622" width="118" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/></g>
  <g opacity="0.55"><rect x="992" y="609" width="118" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/></g>
  <g opacity="0.95">
    <rect x="978" y="596" width="118" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="1037" y="616" font-size="10.5" text-anchor="middle" fill="#14532d">scored phrases</text>
  </g>
  <line x1="978" y1="612" x2="906" y2="608" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1063" y="672" font-size="10.5" text-anchor="middle" font-style="italic" fill="#64748b">&#8230; from many other tasks</text>

  <!-- LLM -->
  <rect x="760" y="562" width="140" height="62" rx="12" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5" filter="url(#soft)"/>
  <text x="830" y="589" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">LLM</text>
  <text x="830" y="609" font-size="11.5" text-anchor="middle" fill="#2b6cb0">rules distiller</text>

  <!-- LLM -> rules -->
  <line x1="760" y1="596" x2="292" y2="596" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="112" y="566" width="176" height="58" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#soft)"/>
  <text x="200" y="590" font-size="15" font-weight="bold" text-anchor="middle" fill="#312e81">phrasing rules</text>
  <text x="200" y="609" font-size="11.5" text-anchor="middle" fill="#6d28d9">updated</text>

  <!-- previous-rules arc -->
  <path d="M 262 566 C 420 500, 610 502, 754 566" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>
  <circle cx="536" cy="516" r="12" fill="white" stroke="#64748b" stroke-width="1.4"/>
  <text x="536" y="521" font-size="14" text-anchor="middle" fill="#334155">⊕</text>
  <text x="536" y="497" font-size="11" text-anchor="middle" fill="#64748b" font-style="italic">with previous phrasing rules</text>

  <!-- iterate loop -->
  <path d="M 108 590 C 18 548, 12 380, 96 296" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#arr)" opacity="0.75"/>
  <text x="31" y="448" font-size="11.5" fill="#7c3aed" font-style="italic" transform="rotate(-74 43 448)">iterate</text>
</svg>
