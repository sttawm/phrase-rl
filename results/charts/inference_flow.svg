<svg viewBox="0 0 1060 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrx" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#94a3b8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1060" height="380" fill="white"/>

  <!-- task instruction -->
  <rect x="60" y="110" width="200" height="60" rx="11" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft)"/>
  <text x="160" y="146" font-size="16" text-anchor="middle" fill="#334155">task instruction</text>

  <!-- VLA -->
  <rect x="840" y="108" width="112" height="64" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="896" y="136" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">VLA</text>
  <text x="896" y="158" font-size="14" text-anchor="middle" fill="#2b6cb0">executor</text>

  <!-- cancelled direct edge -->
  <line x1="260" y1="140" x2="834" y2="140" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="7,6" marker-end="url(#arrx)"/>
  <line x1="536" y1="128" x2="560" y2="152" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <line x1="560" y1="128" x2="536" y2="152" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

  <!-- detour through rephraser -->
  <path d="M 218 170 C 260 236, 330 250, 440 252" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="445" y="216" width="210" height="72" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="550" y="248" font-size="20" font-weight="bold" text-anchor="middle" fill="#312e81">rephraser</text>
  <text x="550" y="272" font-size="14" text-anchor="middle" fill="#6d28d9">VLM</text>
  <path d="M 655 252 C 762 250, 820 216, 862 178" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="782" y="262" font-size="14.5" font-style="italic" fill="#16a34a">with rephrased</text>
  <text x="782" y="280" font-size="14.5" font-style="italic" fill="#16a34a">instruction</text>

  <!-- phrasing rules card -->
  <rect x="472" y="322" width="156" height="42" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4" filter="url(#soft)"/>
  <text x="550" y="349" font-size="14" text-anchor="middle" fill="#6d28d9">phrasing rules</text>
  <line x1="550" y1="322" x2="550" y2="292" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr)" opacity="0.8"/>
</svg>
