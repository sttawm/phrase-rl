<svg viewBox="0 0 900 316" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrx" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#94a3b8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="900" height="316" fill="white"/>

  <!-- task instruction -->
  <rect x="50" y="70" width="190" height="56" rx="11" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft)"/>
  <text x="145" y="104" font-size="16" text-anchor="middle" fill="#334155">task instruction</text>

  <!-- VLA -->
  <rect x="700" y="66" width="112" height="64" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="756" y="94" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">VLA</text>
  <text x="756" y="116" font-size="14" text-anchor="middle" fill="#2b6cb0">executor</text>

  <!-- cancelled direct edge -->
  <line x1="240" y1="98" x2="694" y2="98" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="7,6" marker-end="url(#arrx)"/>
  <line x1="458" y1="87" x2="480" y2="109" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <line x1="480" y1="87" x2="458" y2="109" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

  <!-- detour through rephraser (symmetric) -->
  <path d="M 218 126 C 290 184, 322 200, 371 202" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="375" y="170" width="190" height="66" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="470" y="199" font-size="20" font-weight="bold" text-anchor="middle" fill="#312e81">rephraser</text>
  <text x="470" y="222" font-size="14" text-anchor="middle" fill="#6d28d9">VLM</text>
  <path d="M 569 202 C 618 200, 650 184, 722 130" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- phrasing rules card -->
  <rect x="395" y="266" width="150" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4" filter="url(#soft)"/>
  <text x="470" y="292" font-size="14" text-anchor="middle" fill="#6d28d9">phrasing rules</text>
  <line x1="470" y1="266" x2="470" y2="242" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr)" opacity="0.8"/>
</svg>
