<svg viewBox="0 0 440 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrx" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#94a3b8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="440" height="400" fill="white"/>

  <!-- task instruction -->
  <rect x="112" y="40" width="200" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft)"/>
  <text x="212" y="72" font-size="16" text-anchor="middle" fill="#334155">task instruction</text>
  <line x1="212" y1="92" x2="212" y2="144" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- rephraser (method-agnostic) -->
  <rect x="110" y="148" width="204" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7" filter="url(#soft)"/>
  <text x="212" y="180" font-size="20" font-weight="bold" text-anchor="middle" fill="#312e81">rephraser</text>
  <text x="212" y="204" font-size="14" text-anchor="middle" fill="#6d28d9">VLM</text>
  <line x1="212" y1="220" x2="212" y2="282" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- VLA -->
  <rect x="156" y="286" width="112" height="64" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="212" y="314" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">VLA</text>
  <text x="212" y="336" font-size="14" text-anchor="middle" fill="#2b6cb0">executor</text>

  <!-- cancelled direct path -->
  <path d="M 312 66 C 372 66, 388 84, 388 172" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="7,6"/>
  <path d="M 388 210 C 388 300, 372 318, 274 318" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="7,6" marker-end="url(#arrx)"/>
  <line x1="382" y1="185" x2="394" y2="197" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="394" y1="185" x2="382" y2="197" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>
</svg>
