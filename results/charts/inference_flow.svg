<svg viewBox="0 0 1060 216" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#64748b"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1060" height="216" fill="white"/>

  <!-- human -->
  <circle cx="62" cy="104" r="14" fill="#94a3b8"/>
  <path d="M 36 152 C 36 126, 88 126, 88 152 Z" fill="#94a3b8"/>
  <text x="62" y="176" font-size="14" text-anchor="middle" fill="#475569">human</text>
  <line x1="94" y1="128" x2="126" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- task instruction -->
  <rect x="130" y="100" width="188" height="56" rx="11" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft)"/>
  <text x="224" y="134" font-size="16" text-anchor="middle" fill="#334155">task instruction</text>
  <line x1="318" y1="128" x2="382" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- phrasing rules card -->
  <rect x="411" y="14" width="158" height="42" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4" filter="url(#soft)"/>
  <text x="490" y="41" font-size="14" text-anchor="middle" fill="#6d28d9">phrasing rules</text>
  <line x1="490" y1="56" x2="490" y2="88" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr)" opacity="0.8"/>

  <!-- rephraser -->
  <rect x="386" y="92" width="208" height="72" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="490" y="124" font-size="20" font-weight="bold" text-anchor="middle" fill="#312e81">rephraser</text>
  <text x="490" y="148" font-size="14" text-anchor="middle" fill="#6d28d9">VLM</text>
  <line x1="594" y1="128" x2="656" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- rephrased instruction -->
  <rect x="660" y="100" width="222" height="56" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#soft)"/>
  <text x="771" y="134" font-size="16" text-anchor="middle" fill="#14532d">rephrased instruction</text>
  <line x1="882" y1="128" x2="936" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- VLA -->
  <rect x="940" y="92" width="108" height="72" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="994" y="124" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">VLA</text>
  <text x="994" y="148" font-size="14" text-anchor="middle" fill="#2b6cb0">executor</text>
</svg>
