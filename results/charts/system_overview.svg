<svg viewBox="0 0 1060 874" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrx" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#94a3b8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1060" height="874" fill="white"/>

  <text x="24" y="34" font-size="19" font-weight="bold" letter-spacing="1.5" fill="#1e293b">DEPLOYMENT</text>
  <rect x="10" y="46" width="1040" height="240" rx="14" fill="#f1f5f9" opacity="0.85"/>
  <g transform="translate(180,22)">

  <!-- task instruction -->
  <rect x="36" y="54" width="178" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft)"/>
  <text x="125" y="86" font-size="16" text-anchor="middle" fill="#334155">task instruction</text>

  <!-- VLA -->
  <rect x="556" y="50" width="108" height="60" rx="10" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="610" y="77" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">VLA</text>
  <text x="610" y="98" font-size="14" text-anchor="middle" fill="#2b6cb0">executor</text>

  <!-- cancelled direct edge -->
  <line x1="214" y1="80" x2="368" y2="80" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="7,6"/>
  <line x1="398" y1="80" x2="550" y2="80" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="7,6" marker-end="url(#arrx)"/>
  <line x1="377" y1="74" x2="389" y2="86" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="389" y1="74" x2="377" y2="86" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>

  <!-- detour through rephraser -->
  <path d="M 196 106 C 236 148, 256 158, 286 160" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="292" y="132" width="182" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="383" y="160" font-size="20" font-weight="bold" text-anchor="middle" fill="#312e81">rephraser</text>
  <text x="383" y="182" font-size="14" text-anchor="middle" fill="#6d28d9">VLM</text>
  <path d="M 474 160 C 510 158, 530 148, 566 114" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- phrasing rules card -->
  <rect x="310" y="212" width="146" height="32" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3" filter="url(#soft)"/>
  <text x="383" y="233" font-size="13.5" text-anchor="middle" fill="#6d28d9">phrasing rules</text>
  <line x1="383" y1="212" x2="383" y2="198" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)" opacity="0.8"/>
</g>

  <text x="24" y="330" font-size="19" font-weight="bold" letter-spacing="1.5" fill="#1e293b">TRAINING</text>
  <g transform="translate(0,342)">

  <!-- bands -->
  <rect x="10" y="10" width="588" height="272" rx="14" fill="#f5f3ff" opacity="0.55"/>
  <text x="26" y="34" font-size="13" letter-spacing="2.5" fill="#8b5cf6" font-weight="bold">GENERATE</text>
  <rect x="606" y="10" width="444" height="336" rx="14" fill="#f0f9ff" opacity="0.6"/>
  <text x="1034" y="36" font-size="13" letter-spacing="2.5" fill="#0ea5e9" font-weight="bold" text-anchor="end">EVALUATE</text>
  <rect x="10" y="360" width="1040" height="150" rx="14" fill="#fffbeb" opacity="0.55"/>
  <text x="26" y="498" font-size="13" letter-spacing="2.5" fill="#d97706" font-weight="bold">DISTILL &amp; ITERATE</text>

  <!-- original instruction -->
  <rect x="36" y="46" width="206" height="56" rx="11" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft)"/>
  <text x="139" y="70" font-size="16" text-anchor="middle" fill="#334155">original / training</text>
  <text x="139" y="91" font-size="16" text-anchor="middle" fill="#334155">instruction</text>
  <line x1="139" y1="102" x2="139" y2="136" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- rephraser -->
  <rect x="36" y="140" width="206" height="64" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="139" y="168" font-size="20" font-weight="bold" text-anchor="middle" fill="#312e81">rephraser</text>
  <text x="139" y="190" font-size="14" text-anchor="middle" fill="#6d28d9">VLM</text>

  <!-- fan-out -->
  <path d="M 242 158 C 268 140, 278 128, 296 116" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <path d="M 242 186 C 268 204, 278 216, 296 228" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="292" y="76" width="136" height="38" rx="19" fill="white" stroke="#a5b4fc" stroke-width="1.4"/>
  <text x="360" y="101" font-size="15" text-anchor="middle" fill="#3730a3">rephrase 1</text>
  <text x="360" y="178" font-size="20" text-anchor="middle" fill="#a5b4fc" font-weight="bold">⋮</text>
  <rect x="292" y="230" width="136" height="38" rx="19" fill="white" stroke="#a5b4fc" stroke-width="1.4"/>
  <text x="360" y="255" font-size="15" text-anchor="middle" fill="#3730a3">rephrase N</text>
  <path d="M 428 112 C 452 122, 462 138, 474 152" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <path d="M 428 232 C 452 222, 462 206, 474 192" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- VLA -->
  <rect x="462" y="140" width="122" height="64" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="523" y="168" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">VLA</text>
  <text x="523" y="190" font-size="14" text-anchor="middle" fill="#2b6cb0">executor</text>

  <!-- rank / evaluate -->
  <text x="742" y="196" font-size="15" font-weight="bold" letter-spacing="1.2" text-anchor="middle" fill="#475569">RANK / EVALUATE</text>
  <line x1="660" y1="206" x2="824" y2="206" stroke="#cbd5e1" stroke-width="1"/>

  <!-- sim branch -->
  <path d="M 584 152 C 610 128, 620 112, 636 98" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="640" y="58" width="240" height="62" rx="11" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" filter="url(#soft)"/>
  <text x="760" y="84" font-size="15.5" text-anchor="middle" fill="#134e4a">score with simulation</text>
  <text x="760" y="105" font-size="15.5" text-anchor="middle" fill="#134e4a">success-rate</text>
  <rect x="683" y="28" width="154" height="26" rx="13" fill="white" stroke="#0d9488" stroke-width="1.1"/>
  <text x="760" y="46" font-size="13" text-anchor="middle" fill="#0f766e">simulatable tasks</text>

  <!-- proxy branch -->
  <path d="M 584 192 C 610 216, 620 232, 636 246" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="640" y="240" width="240" height="62" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" filter="url(#soft)"/>
  <text x="760" y="266" font-size="15.5" text-anchor="middle" fill="#7c2d12">score with</text>
  <text x="760" y="287" font-size="15.5" text-anchor="middle" fill="#7c2d12">success-rate proxy</text>
  <rect x="646" y="308" width="228" height="26" rx="13" fill="white" stroke="#ea580c" stroke-width="1.1"/>
  <text x="760" y="326" font-size="13" text-anchor="middle" fill="#9a3412">non-simulatable / real-world tasks</text>

  <!-- scored phrases -->
  <path d="M 880 86 C 920 96, 940 122, 952 148" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <path d="M 880 274 C 920 264, 940 238, 952 212" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="898" y="146" width="142" height="68" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" filter="url(#soft)"/>
  <text x="969" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#14532d">scored</text>
  <text x="969" y="197" font-size="18" font-weight="bold" text-anchor="middle" fill="#14532d">phrases</text>

  <!-- sweep to LLM -->
  <path d="M 969 214 C 969 320, 900 396, 812 416" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- LLM -->
  <rect x="656" y="398" width="152" height="70" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="732" y="430" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">LLM</text>
  <text x="732" y="452" font-size="14" text-anchor="middle" fill="#2b6cb0">rules distiller</text>

  <!-- stack from other tasks -->
  <g opacity="0.30"><rect x="856" y="462" width="138" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/></g>
  <g opacity="0.55"><rect x="844" y="449" width="138" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/></g>
  <g opacity="0.95">
    <rect x="832" y="436" width="138" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="901" y="461" font-size="13.5" text-anchor="middle" fill="#14532d">scored phrases</text>
  </g>
  <line x1="832" y1="452" x2="812" y2="446" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="920" y="514" font-size="12.5" text-anchor="middle" font-style="italic" fill="#64748b">&#8230; from many other tasks</text>

  <!-- LLM -> rules -->
  <line x1="656" y1="436" x2="290" y2="436" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="84" y="400" width="200" height="68" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="184" y="429" font-size="18" font-weight="bold" text-anchor="middle" fill="#312e81">phrasing rules</text>
  <text x="184" y="451" font-size="14" text-anchor="middle" fill="#6d28d9">updated</text>

  <!-- previous-rules arc -->
  <path d="M 258 400 C 400 356, 530 358, 652 400" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="452" cy="371" r="13" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="452" y="376" font-size="15" text-anchor="middle" fill="#334155">⊕</text>
  <text x="452" y="350" font-size="13" text-anchor="middle" font-style="italic" fill="#64748b">with previous phrasing rules</text>

  <!-- iterate loop -->
  <path d="M 84 430 C 12 400, 8 262, 44 196" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arr)" opacity="0.75"/>
  <text x="30" y="322" font-size="14" fill="#7c3aed" font-style="italic" transform="rotate(-75 40 322)">iterate</text>
</g>
</svg>
