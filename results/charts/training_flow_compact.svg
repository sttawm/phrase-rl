<svg viewBox="0 0 1200 566" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#64748b"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="566" fill="white"/>

  <!-- bands -->
  <rect x="16" y="14" width="612" height="268" rx="16" fill="#f5f3ff" opacity="0.55"/>
  <text x="34" y="40" font-size="12" letter-spacing="3" fill="#8b5cf6" font-weight="bold">GENERATE</text>
  <rect x="644" y="14" width="540" height="352" rx="16" fill="#f0f9ff" opacity="0.6"/>
  <text x="662" y="40" font-size="12" letter-spacing="3" fill="#0ea5e9" font-weight="bold">EVALUATE</text>
  <rect x="16" y="384" width="1168" height="168" rx="16" fill="#fffbeb" opacity="0.55"/>
  <text x="34" y="538" font-size="12" letter-spacing="3" fill="#d97706" font-weight="bold">DISTILL &amp; ITERATE</text>

  <!-- original instruction -->
  <rect x="46" y="54" width="216" height="58" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft)"/>
  <text x="154" y="78" font-size="15" text-anchor="middle" fill="#334155">original / training</text>
  <text x="154" y="98" font-size="15" text-anchor="middle" fill="#334155">instruction</text>
  <line x1="154" y1="112" x2="154" y2="150" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- rephraser -->
  <rect x="52" y="154" width="204" height="66" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="154" y="182" font-size="18" font-weight="bold" text-anchor="middle" fill="#312e81">rephraser</text>
  <text x="154" y="204" font-size="13" text-anchor="middle" fill="#6d28d9">VLM</text>

  <!-- fan-out -->
  <path d="M 256 172 C 296 150, 316 136, 344 128" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <path d="M 256 202 C 296 224, 316 238, 344 246" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="348" y="106" width="140" height="36" rx="18" fill="white" stroke="#a5b4fc" stroke-width="1.4"/>
  <text x="418" y="130" font-size="14" text-anchor="middle" fill="#3730a3">rephrase 1</text>
  <text x="418" y="196" font-size="19" text-anchor="middle" fill="#a5b4fc" font-weight="bold">⋮</text>
  <rect x="348" y="232" width="140" height="36" rx="18" fill="white" stroke="#a5b4fc" stroke-width="1.4"/>
  <text x="418" y="256" font-size="14" text-anchor="middle" fill="#3730a3">rephrase N</text>
  <path d="M 488 128 C 520 136, 538 152, 556 168" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <path d="M 488 246 C 520 238, 538 222, 556 206" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- VLA -->
  <rect x="560" y="154" width="132" height="66" rx="12" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="626" y="182" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e3a8a">VLA</text>
  <text x="626" y="204" font-size="13" text-anchor="middle" fill="#2b6cb0">executor</text>

  <!-- rank / evaluate -->
  <text x="828" y="192" font-size="14" font-weight="bold" letter-spacing="1.5" text-anchor="middle" fill="#475569">RANK / EVALUATE</text>
  <line x1="748" y1="202" x2="908" y2="202" stroke="#cbd5e1" stroke-width="1"/>

  <!-- sim branch -->
  <path d="M 692 164 C 714 136, 722 118, 736 102" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="740" y="58" width="244" height="62" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" filter="url(#soft)"/>
  <text x="862" y="84" font-size="14.5" text-anchor="middle" fill="#134e4a">score with simulation</text>
  <text x="862" y="104" font-size="14.5" text-anchor="middle" fill="#134e4a">success-rate</text>
  <rect x="786" y="30" width="152" height="24" rx="12" fill="white" stroke="#0d9488" stroke-width="1.1"/>
  <text x="862" y="47" font-size="12" text-anchor="middle" fill="#0f766e">simulatable tasks</text>

  <!-- proxy branch -->
  <path d="M 692 210 C 714 238, 722 256, 736 272" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="740" y="266" width="244" height="62" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" filter="url(#soft)"/>
  <text x="862" y="292" font-size="14.5" text-anchor="middle" fill="#7c2d12">score with</text>
  <text x="862" y="312" font-size="14.5" text-anchor="middle" fill="#7c2d12">success-rate proxy</text>
  <rect x="746" y="334" width="232" height="24" rx="12" fill="white" stroke="#ea580c" stroke-width="1.1"/>
  <text x="862" y="351" font-size="12" text-anchor="middle" fill="#9a3412">non-simulatable / real-world tasks</text>

  <!-- scored phrases -->
  <path d="M 984 88 C 1044 100, 1072 132, 1088 162" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <path d="M 984 296 C 1044 284, 1072 252, 1088 222" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="1016" y="160" width="158" height="66" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" filter="url(#soft)"/>
  <text x="1095" y="188" font-size="16.5" font-weight="bold" text-anchor="middle" fill="#14532d">scored</text>
  <text x="1095" y="210" font-size="16.5" font-weight="bold" text-anchor="middle" fill="#14532d">phrases</text>

  <!-- sweep to LLM -->
  <path d="M 1095 226 C 1095 330, 1010 430, 886 448" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- LLM -->
  <rect x="716" y="420" width="164" height="72" rx="12" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="798" y="452" font-size="19" font-weight="bold" text-anchor="middle" fill="#1e3a8a">LLM</text>
  <text x="798" y="474" font-size="13" text-anchor="middle" fill="#2b6cb0">rules distiller</text>

  <!-- stack from other tasks -->
  <g opacity="0.30"><rect x="948" y="496" width="140" height="38" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/></g>
  <g opacity="0.55"><rect x="934" y="481" width="140" height="38" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/></g>
  <g opacity="0.95">
    <rect x="920" y="466" width="140" height="38" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="990" y="490" font-size="12.5" text-anchor="middle" fill="#14532d">scored phrases</text>
  </g>
  <line x1="920" y1="484" x2="886" y2="472" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="1004" y="550" font-size="12" text-anchor="middle" font-style="italic" fill="#64748b">&#8230; from many other tasks</text>

  <!-- LLM -> rules -->
  <line x1="716" y1="458" x2="298" y2="458" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="92" y="424" width="202" height="68" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="193" y="452" font-size="17" font-weight="bold" text-anchor="middle" fill="#312e81">phrasing rules</text>
  <text x="193" y="474" font-size="13" text-anchor="middle" fill="#6d28d9">updated</text>

  <!-- previous-rules arc -->
  <path d="M 268 424 C 420 372, 580 374, 712 424" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="500" cy="385" r="13" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="390" font-size="15" text-anchor="middle" fill="#334155">⊕</text>
  <text x="500" y="364" font-size="12.5" text-anchor="middle" font-style="italic" fill="#64748b">with previous phrasing rules</text>

  <!-- iterate loop -->
  <path d="M 92 452 C 14 420, 10 280, 70 210" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arr)" opacity="0.75"/>
  <text x="34" y="330" font-size="13" fill="#7c3aed" font-style="italic" transform="rotate(-73 44 330)">iterate</text>
</svg>
