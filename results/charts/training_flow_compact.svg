<svg viewBox="0 0 1060 492" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 C 3 8.5, 3 3.5, 1 1.5 z" fill="#64748b"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1060" height="492" fill="white"/>

  <!-- bands -->
  <rect x="10" y="10" width="588" height="272" rx="14" fill="#f5f3ff" opacity="0.55"/>
  <text x="26" y="34" font-size="13" letter-spacing="2.5" fill="#8b5cf6" font-weight="bold">GENERATE</text>
  <rect x="606" y="10" width="444" height="304" rx="14" fill="#f0f9ff" opacity="0.6"/>
  <text x="1034" y="36" font-size="13" letter-spacing="2.5" fill="#0ea5e9" font-weight="bold" text-anchor="end">EVALUATE</text>
  <rect x="10" y="328" width="1040" height="150" rx="14" fill="#fffbeb" opacity="0.55"/>
  <text x="26" y="466" font-size="13" letter-spacing="2.5" fill="#d97706" font-weight="bold">DISTILL &amp; ITERATE</text>

  <!-- task instruction -->
  <rect x="36" y="50" width="206" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft)"/>
  <text x="139" y="80" font-size="16" text-anchor="middle" fill="#334155">task instruction</text>
  <line x1="139" y1="98" x2="139" y2="136" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- rephraser -->
  <rect x="36" y="140" width="206" height="64" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="139" y="168" font-size="20" font-weight="bold" text-anchor="middle" fill="#312e81">rephraser</text>
  <text x="139" y="190" font-size="14" text-anchor="middle" fill="#6d28d9">VLM</text>

  <!-- fan-out -->
  <path d="M 242 158 C 268 140, 278 128, 296 116" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <path d="M 242 186 C 268 204, 278 216, 296 228" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="292" y="76" width="136" height="38" rx="19" fill="white" stroke="#a5b4fc" stroke-width="1.4"/>
  <text x="360" y="101" font-size="15" text-anchor="middle" fill="#3730a3">rephrase 1</text>
  <text x="360" y="178" font-size="20" text-anchor="middle" fill="#a5b4fc" font-weight="bold">⋮</text>
  <rect x="292" y="230" width="136" height="38" rx="19" fill="white" stroke="#a5b4fc" stroke-width="1.4"/>
  <text x="360" y="255" font-size="15" text-anchor="middle" fill="#3730a3">rephrase N</text>
  <path d="M 428 112 C 452 122, 462 138, 474 152" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <path d="M 428 232 C 452 222, 462 206, 474 192" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- VLA -->
  <rect x="462" y="140" width="122" height="64" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="523" y="168" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">VLA</text>
  <text x="523" y="190" font-size="14" text-anchor="middle" fill="#2b6cb0">executor</text>

  <!-- sim branch -->
  <path d="M 584 152 C 606 134, 616 120, 634 110" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="640" y="76" width="240" height="62" rx="11" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" filter="url(#soft)"/>
  <text x="760" y="102" font-size="15.5" text-anchor="middle" fill="#134e4a">score with simulation</text>
  <text x="760" y="123" font-size="15.5" text-anchor="middle" fill="#134e4a">success-rate</text>
  <rect x="683" y="44" width="154" height="26" rx="13" fill="white" stroke="#0d9488" stroke-width="1.1"/>
  <text x="760" y="62" font-size="13" text-anchor="middle" fill="#0f766e">simulatable tasks</text>

  <!-- proxy branch -->
  <path d="M 584 192 C 606 210, 616 224, 634 234" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="640" y="206" width="240" height="62" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" filter="url(#soft)"/>
  <text x="760" y="232" font-size="15.5" text-anchor="middle" fill="#7c2d12">score with</text>
  <text x="760" y="253" font-size="15.5" text-anchor="middle" fill="#7c2d12">success-rate proxy</text>
  <rect x="646" y="274" width="228" height="26" rx="13" fill="white" stroke="#ea580c" stroke-width="1.1"/>
  <text x="760" y="292" font-size="13" text-anchor="middle" fill="#9a3412">non-simulatable / real-world tasks</text>

  <!-- scored phrases -->
  <path d="M 880 104 C 918 112, 938 124, 950 142" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <path d="M 880 240 C 918 232, 938 220, 950 202" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="898" y="138" width="142" height="68" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" filter="url(#soft)"/>
  <text x="969" y="167" font-size="18" font-weight="bold" text-anchor="middle" fill="#14532d">scored</text>
  <text x="969" y="189" font-size="18" font-weight="bold" text-anchor="middle" fill="#14532d">phrases</text>

  <!-- sweep to LLM -->
  <path d="M 969 206 C 969 288, 900 364, 812 384" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- LLM -->
  <rect x="656" y="366" width="152" height="70" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#soft)"/>
  <text x="732" y="398" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">LLM</text>
  <text x="732" y="420" font-size="14" text-anchor="middle" fill="#2b6cb0">rules distiller</text>

  <!-- stack from other tasks -->
  <g opacity="0.30"><rect x="856" y="430" width="138" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/></g>
  <g opacity="0.55"><rect x="844" y="417" width="138" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/></g>
  <g opacity="0.95">
    <rect x="832" y="404" width="138" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="901" y="429" font-size="13.5" text-anchor="middle" fill="#14532d">scored phrases</text>
  </g>
  <line x1="832" y1="420" x2="812" y2="414" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="920" y="486" font-size="12.5" text-anchor="middle" font-style="italic" fill="#64748b">&#8230; from many other tasks</text>

  <!-- LLM -> rules -->
  <line x1="656" y1="404" x2="290" y2="404" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="84" y="368" width="200" height="68" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="184" y="397" font-size="18" font-weight="bold" text-anchor="middle" fill="#312e81">phrasing rules</text>
  <text x="184" y="419" font-size="14" text-anchor="middle" fill="#6d28d9">updated</text>

  <!-- previous-rules arc -->
  <path d="M 258 368 C 400 324, 530 326, 652 368" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="452" cy="339" r="13" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="452" y="344" font-size="15" text-anchor="middle" fill="#334155">⊕</text>
  <text x="452" y="318" font-size="13" text-anchor="middle" font-style="italic" fill="#64748b">with previous phrasing rules</text>

  <!-- iterate loop -->
  <path d="M 84 398 C 12 368, 8 244, 40 212" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arr)" opacity="0.75"/>
  <text x="30" y="318" font-size="14" fill="#7c3aed" font-style="italic" transform="rotate(-75 40 318)">iterate</text>
</svg>
